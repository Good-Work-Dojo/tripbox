[project]
name = "tripbox"
version = "1.0.1"
description = "Forwarded travel confirmation emails become a trips page, with an optional AirTrail flight log"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "imap-tools>=1.16,<2",
    "anthropic>=2.3,<3",
    "openai>=3.52,<4",
    "httpx2>=2.0",
    "pydantic>=2.14,<3",
    "pyyaml>=6.0.3",
    "tzdata",
    "airportsdata>=20261103",
    # the trips page (starlette, uvicorn, jinja2, form parsing) and its Cloudflare login (pyjwt)
    "starlette>=1.10,<2",
    "jinja2>=3.1.6,<4",
    "uvicorn>=0.54,<1",
    "python-multipart>=0.0.32",
    "pyjwt[crypto]>=2.15,<3",
    # cover photos: decoded and re-encoded in the worker only
    "pillow>=12,<13",
]

[project.scripts]
tripbox = "tripbox.cli:main"

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tripbox"]
exclude = ["**/AGENTS.md", "**/CLAUDE.md"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["uses_network: talks to the throwaway AirTrail on purpose"]
