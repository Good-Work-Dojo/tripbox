# SPDX-License-Identifier: AGPL-3.0-only
# Additional terms: see NOTICE
# Build the runtime image on an arm64 runner and try it there. On arm64 the image carries Debian's
# kitinerary-extractor (KDE publishes its static build for x86_64 only), so the corpus scorecard,
# a new install and the quick start's stack (tools/verify/stack_smoke.sh) are run on the image as
# built. It runs on a push to main or a pull request that changes what goes into the image,
# decides its extractor, what the corpus holds or how the stack is started and checked (a
# Dependabot update of the base image or the packages among them, proven on arm64 before it is
# merged), and by hand. The runner is a fixed literal, never an expression (see ci.yml). Nothing
# is uploaded.
name: arm64

on:
  push:
    branches: [main]
    paths: ['Dockerfile', '.dockerignore', 'pyproject.toml', 'uv.lock', 'compose.yaml',
            'src/tripbox/parse/**', 'tests/corpus/**', 'tools/verify/stack_smoke.sh',
            'tools/verify/quickstart_check.py', '.github/workflows/arm64.yml']
  pull_request:
    paths: ['Dockerfile', '.dockerignore', 'pyproject.toml', 'uv.lock', 'compose.yaml',
            'src/tripbox/parse/**', 'tests/corpus/**', 'tools/verify/stack_smoke.sh',
            'tools/verify/quickstart_check.py', '.github/workflows/arm64.yml']
  workflow_dispatch:

concurrency:
  group: arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Workflow rules
        run: python3 tools/verify/check_workflows.py
      - name: Build runtime image
        run: docker build --target runtime -t tripboxoss:arm64 .
      - name: Architecture
        run: test "$(docker run --rm --network none tripboxoss:arm64 uname -m)" = aarch64
      # bash named outright runs with pipefail, so a failing eval fails the step through tee
      - name: Corpus scorecard
        shell: bash
        run: |
          docker run --rm --network none --user 12345:54321 --read-only --tmpfs /tmp tripboxoss:arm64 python -m tripbox eval --recorded | tee "$RUNNER_TEMP/scorecard.txt"
          grep -Eqx 'eval: ([0-9]+) of \1 emails right' "$RUNNER_TEMP/scorecard.txt"
          grep -q '^parsers: kitinerary: 3 ' "$RUNNER_TEMP/scorecard.txt"
      - name: A new install as any user
        run: >-
          docker run --rm --network none --user 12345:54321 --read-only --tmpfs /tmp
          -v "$PWD:/repo:ro" -w /repo -e PYTHONDONTWRITEBYTECODE=1
          -e TRIPBOX_DATA_DIR=/tmp/data -e TRIPBOX_LOGS_DIR=/tmp/logs
          -e TRIPBOX_ARCHIVE_DIR=/tmp/archive -e TRIPBOX_CONFIG_DIR=/tmp/config
          tripboxoss:arm64 python /repo/tools/verify/standalone_smoke.py
      - name: Stack
        run: TRIPBOX_SMOKE=1 tools/verify/stack_smoke.sh --image tripboxoss:arm64
