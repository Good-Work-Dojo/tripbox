# SPDX-License-Identifier: AGPL-3.0-only
# Additional terms: see NOTICE
# The release: when a release is published (or when run by hand for an existing release's tag, to
# publish it again), the install bundle is attached to the release, the runtime image is built
# natively on an amd64 and an arm64 runner, each pushed to GitHub's container registry by its
# digest alone, the two are joined into one multi-architecture image under the release's tags, and
# each architecture is pulled back and proven on its own runner.
# Names and tags come from tools/verify/release_names.py: ghcr.io/<this repository, lower-cased>,
# tagged with the version (the git tag without its v), plus <major>.<minor>, <major> and latest
# for a full release at or above the highest full release published; a patch to an older line gets
# its version alone. A prerelease is a rehearsal: tagged with its version alone, and once proven
# (or failed) the three package versions this run pushed, and nothing else, are removed again.
# The commit built is the tag's, except for a run by hand on a prerelease, which builds the commit
# it was run on, so a candidate can be rehearsed again without moving its tag. Every job checks
# out that commit, and the image's labels and annotations are the project's, their revision that
# commit and their creation time its commit time.
# The only actions are GitHub's own (actions/*), pinned by commit; the builder, the registry
# sign-in and the builds are docker's own commands, and the builder runs BuildKit from
# moby/buildkit pinned by digest (a newer one is a change made here by hand: `docker buildx
# imagetools inspect moby/buildkit:<version>` prints the digest). The token is read only through
# a step's environment and given to `docker login` on standard input. No job holds more than it
# needs: the bundle job alone writes to the repository (its release's asset and, when the release
# has none, its notes), the build, join and remove jobs alone write packages.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "an existing release's tag, to publish it again"
        required: true
        type: string

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions: {}

jobs:
  # the release must exist; the commit built, its time, and the names, tags and labels it gets;
  # a tag of another form, one that is not the package's version, or no CHANGELOG.md section for
  # it stops the release here, before anything is built or pushed
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.names.outputs.sha }}
      created: ${{ steps.names.outputs.created }}
      image: ${{ steps.names.outputs.image }}
      version: ${{ steps.names.outputs.version }}
      tags: ${{ steps.names.outputs.tags }}
      rehearsal: ${{ steps.names.outputs.rehearsal }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: names
        name: The commit, the names, the tags and the notes
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          DISPATCHED: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "release: the tag is not of the form v1.2.3 or v1.2.3-rc.1" >&2; exit 1; }
          PRERELEASE="$(gh release view "$TAG" --repo "$REPOSITORY" --json isPrerelease --jq .isPrerelease)" \
            || { echo "release: there is no release $TAG" >&2; exit 1; }
          case "$PRERELEASE" in true | false) ;; *) echo "release: $TAG reads as neither a prerelease nor a release" >&2; exit 1 ;; esac
          if [ "$EVENT" = workflow_dispatch ] && [ "$PRERELEASE" = true ]; then
            SHA="$DISPATCHED"
          else
            SHA="$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}")" \
              || { echo "release: the tag $TAG names no commit" >&2; exit 1; }
          fi
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "release: the commit to build could not be read" >&2; exit 1; }
          git checkout -q --detach "$SHA"
          CREATED="$(git show -s --format=%ct "$SHA")"
          [[ "$CREATED" =~ ^[0-9]+$ ]] || { echo "release: the commit's time could not be read" >&2; exit 1; }
          flag=()
          if [ "$PRERELEASE" = true ]; then flag=(--prerelease); fi
          gh release list --repo "$REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1000 \
            --json tagName --jq '.[].tagName' >"$RUNNER_TEMP/released"
          HIGHEST="$(python3 tools/verify/release_names.py highest <"$RUNNER_TEMP/released")"
          if [ -n "$HIGHEST" ]; then flag+=(--highest-full "$HIGHEST"); fi
          python3 tools/verify/release_names.py matches pyproject.toml "$TAG"
          python3 tools/verify/release_names.py names "$REPOSITORY" "$TAG" "${flag[@]}" >"$RUNNER_TEMP/names"
          python3 tools/verify/release_names.py notes CHANGELOG.md "$TAG" >/dev/null
          python3 tools/verify/release_names.py labels "$SOURCE" "${TAG#v}" "$SHA" "$CREATED" >/dev/null
          { echo "sha=$SHA"; echo "created=$CREATED"; cat "$RUNNER_TEMP/names"; } >>"$GITHUB_OUTPUT"
          { echo "## $TAG"; echo; echo "Commit $SHA"; echo; sed 's/^/    /' "$RUNNER_TEMP/names"; } \
            >>"$GITHUB_STEP_SUMMARY"

  # the install bundle the quick start fetches, attached to the release; the release's notes are
  # CHANGELOG.md's section for the version, set only when the release has none
  bundle:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      # built with no token in reach; only the step that calls gh holds one
      - name: Build the bundle
        run: python3 tools/maintainer/install_bundle.py --out "$RUNNER_TEMP/tripbox.tar.gz"
      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$RUNNER_TEMP/tripbox.tar.gz" --repo "$REPOSITORY" --clobber
          body="$(gh release view "$TAG" --repo "$REPOSITORY" --json body --jq .body)"
          if [ -z "${body//[[:space:]]/}" ]; then
            python3 tools/verify/release_names.py notes CHANGELOG.md "$TAG" >"$RUNNER_TEMP/notes.md"
            gh release edit "$TAG" --repo "$REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  # one job per architecture, each on its own native runner (no emulation): the image pushed by
  # its digest alone, with no attestation, and that digest read back from the build's metadata
  build-amd64:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Start a BuildKit builder from its image pinned by digest
        env:
          BUILDKIT: moby/buildkit@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe # v0.34.2
        run: |
          set -euo pipefail
          docker buildx create --name release --driver docker-container --driver-opt "image=$BUILDKIT" --use
          docker buildx inspect --bootstrap
      - name: Sign in to the registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - id: build
        name: Build the image and push it by its digest
        env:
          PLATFORM: linux/amd64
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ needs.prepare.outputs.sha }}
          CREATED: ${{ needs.prepare.outputs.created }}
        run: |
          set -euo pipefail
          python3 tools/verify/release_names.py labels "$SOURCE" "$VERSION" "$REVISION" "$CREATED" \
            >"$RUNNER_TEMP/labels.args"
          mapfile -t meta <"$RUNNER_TEMP/labels.args"
          docker buildx build --target runtime --platform "$PLATFORM" --provenance=false --sbom=false \
            "${meta[@]}" --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "$RUNNER_TEMP/build.json" .
          digest="$(python3 tools/verify/release_names.py digest "$RUNNER_TEMP/build.json")"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
      - name: Sign out of the registry
        if: always()
        run: docker logout ghcr.io

  build-arm64:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Start a BuildKit builder from its image pinned by digest
        env:
          BUILDKIT: moby/buildkit@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe # v0.34.2
        run: |
          set -euo pipefail
          docker buildx create --name release --driver docker-container --driver-opt "image=$BUILDKIT" --use
          docker buildx inspect --bootstrap
      - name: Sign in to the registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - id: build
        name: Build the image and push it by its digest
        env:
          PLATFORM: linux/arm64
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ needs.prepare.outputs.sha }}
          CREATED: ${{ needs.prepare.outputs.created }}
        run: |
          set -euo pipefail
          python3 tools/verify/release_names.py labels "$SOURCE" "$VERSION" "$REVISION" "$CREATED" \
            >"$RUNNER_TEMP/labels.args"
          mapfile -t meta <"$RUNNER_TEMP/labels.args"
          docker buildx build --target runtime --platform "$PLATFORM" --provenance=false --sbom=false \
            "${meta[@]}" --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "$RUNNER_TEMP/build.json" .
          digest="$(python3 tools/verify/release_names.py digest "$RUNNER_TEMP/build.json")"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
      - name: Sign out of the registry
        if: always()
        run: docker logout ghcr.io

  # the multi-architecture image: an index of the two digests under every tag, with the index's
  # own annotations, and the index's digest read back
  join:
    needs: [prepare, build-amd64, build-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
    outputs:
      digest: ${{ steps.join.outputs.digest }}
    steps:
      - name: Sign in to the registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - id: join
        name: Join the two architectures under the release's tags
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAGS: ${{ needs.prepare.outputs.tags }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ needs.prepare.outputs.sha }}
          AMD64: ${{ needs.build-amd64.outputs.digest }}
          ARM64: ${{ needs.build-arm64.outputs.digest }}
        run: |
          set -euo pipefail
          for d in "$AMD64" "$ARM64"; do
            [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "release: a build job gave no digest" >&2; exit 1; }
          done
          read -ra tags <<<"$TAGS"
          args=()
          for t in "${tags[@]}"; do args+=(--tag "$IMAGE:$t"); done
          args+=(--annotation "index:org.opencontainers.image.title=tripbox"
                 --annotation "index:org.opencontainers.image.licenses=AGPL-3.0-only"
                 --annotation "index:org.opencontainers.image.source=$SOURCE"
                 --annotation "index:org.opencontainers.image.url=$SOURCE"
                 --annotation "index:org.opencontainers.image.documentation=$SOURCE"
                 --annotation "index:org.opencontainers.image.version=$VERSION"
                 --annotation "index:org.opencontainers.image.revision=$REVISION")
          docker buildx imagetools create "${args[@]}" "$IMAGE@$AMD64" "$IMAGE@$ARM64"
          docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' >"$RUNNER_TEMP/index.json"
          digest="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("digest", ""))' "$RUNNER_TEMP/index.json")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "release: the index's digest could not be read" >&2; exit 1; }
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
      - name: Sign out of the registry
        if: always()
        run: docker logout ghcr.io

  # each architecture pulled by the release's version on a runner of its own: its architecture and
  # labels, the corpus scorecard and the quick start's stack
  verify-amd64:
    needs: [prepare, join]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Sign in to the registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: The image, its architecture and its labels
        env:
          ARCH: amd64
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REVISION: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE:$VERSION"
          docker image inspect "$IMAGE:$VERSION" >"$RUNNER_TEMP/image.json"
          python3 - "$RUNNER_TEMP/image.json" "$ARCH" "$VERSION" "$REVISION" <<'PY'
          import json, sys
          path, arch, version, revision = sys.argv[1:]
          (image,) = json.load(open(path))
          labels = (image.get("Config") or {}).get("Labels") or {}
          found = {"architecture": image.get("Architecture"),
                   "version": labels.get("org.opencontainers.image.version"),
                   "revision": labels.get("org.opencontainers.image.revision"),
                   "licence": labels.get("org.opencontainers.image.licenses")}
          want = {"architecture": arch, "version": version, "revision": revision,
                  "licence": "AGPL-3.0-only"}
          bad = [k for k in want if found[k] != want[k]]
          for k in bad:
              print(f"release: the image's {k} is {found[k]!r}, not {want[k]!r}", file=sys.stderr)
          sys.exit(1 if bad else 0)
          PY
      - name: Corpus scorecard
        shell: bash
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker run --rm --network none --user 12345:54321 --read-only --tmpfs /tmp "$IMAGE:$VERSION" python -m tripbox eval --recorded | tee "$RUNNER_TEMP/scorecard.txt"
          tail -n 1 "$RUNNER_TEMP/scorecard.txt" | grep -Eqx 'eval: ([0-9]+) of \1 emails right'
      - name: Stack
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: TRIPBOX_SMOKE=1 tools/verify/stack_smoke.sh --image "$IMAGE:$VERSION"
      - name: Sign out of the registry
        if: always()
        run: docker logout ghcr.io

  verify-arm64:
    needs: [prepare, join]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Sign in to the registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: The image, its architecture and its labels
        env:
          ARCH: arm64
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REVISION: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE:$VERSION"
          docker image inspect "$IMAGE:$VERSION" >"$RUNNER_TEMP/image.json"
          python3 - "$RUNNER_TEMP/image.json" "$ARCH" "$VERSION" "$REVISION" <<'PY'
          import json, sys
          path, arch, version, revision = sys.argv[1:]
          (image,) = json.load(open(path))
          labels = (image.get("Config") or {}).get("Labels") or {}
          found = {"architecture": image.get("Architecture"),
                   "version": labels.get("org.opencontainers.image.version"),
                   "revision": labels.get("org.opencontainers.image.revision"),
                   "licence": labels.get("org.opencontainers.image.licenses")}
          want = {"architecture": arch, "version": version, "revision": revision,
                  "licence": "AGPL-3.0-only"}
          bad = [k for k in want if found[k] != want[k]]
          for k in bad:
              print(f"release: the image's {k} is {found[k]!r}, not {want[k]!r}", file=sys.stderr)
          sys.exit(1 if bad else 0)
          PY
      - name: Corpus scorecard
        shell: bash
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker run --rm --network none --user 12345:54321 --read-only --tmpfs /tmp "$IMAGE:$VERSION" python -m tripbox eval --recorded | tee "$RUNNER_TEMP/scorecard.txt"
          tail -n 1 "$RUNNER_TEMP/scorecard.txt" | grep -Eqx 'eval: ([0-9]+) of \1 emails right'
      - name: Stack
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: TRIPBOX_SMOKE=1 tools/verify/stack_smoke.sh --image "$IMAGE:$VERSION"
      - name: Sign out of the registry
        if: always()
        run: docker logout ghcr.io

  # a rehearsal leaves nothing behind: the three package versions this run pushed (the two
  # architectures and their index), each found by its digest before anything is deleted, then
  # deleted, then the list read again. Nothing else is touched. When the package holds nothing but
  # those three, the registry refuses to delete its last tagged version, so the package itself is
  # deleted, which removes exactly them; when that is refused, each version is deleted on its own.
  # A digest that is not listed, a list that cannot be read, or a job that ran and gave no digest
  # (it may have pushed one) fails the job, naming what it could not account for. It never runs
  # for a full release, and its script refuses one.
  remove:
    needs: [prepare, bundle, build-amd64, build-arm64, join, verify-amd64, verify-arm64]
    if: always() && needs.prepare.outputs.rehearsal == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Remove what this rehearsal pushed
        env:
          GH_TOKEN: ${{ github.token }}
          REHEARSAL: ${{ needs.prepare.outputs.rehearsal }}
          IMAGE: ${{ needs.prepare.outputs.image }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          AMD64: ${{ needs.build-amd64.outputs.digest }}
          ARM64: ${{ needs.build-arm64.outputs.digest }}
          INDEX: ${{ needs.join.outputs.digest }}
          AMD64_RESULT: ${{ needs.build-amd64.result }}
          ARM64_RESULT: ${{ needs.build-arm64.result }}
          JOIN_RESULT: ${{ needs.join.result }}
        run: |
          set -uo pipefail
          [ "$REHEARSAL" = true ] || { echo "release: this is no rehearsal; nothing is removed" >&2; exit 1; }
          # an organisation's packages are under orgs, a user's under users
          case "$OWNER_TYPE" in
            Organization) KIND=orgs ;;
            User) KIND=users ;;
            *) echo "release: the owner is neither an organisation nor a user" >&2; exit 1 ;;
          esac
          BASE="/$KIND/$OWNER"
          PACKAGE="${IMAGE##*/}"
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          [[ "$OWNER" =~ ^[A-Za-z0-9-]+$ ]] && [ "$IMAGE" = "ghcr.io/$owner/$PACKAGE" ] \
            && [[ "$PACKAGE" =~ ^[a-z0-9._-]+$ ]] \
            || { echo "release: the image is not this owner's package" >&2; exit 1; }
          PACKAGE_PATH="$BASE/packages/container/$PACKAGE"
          ERR="$RUNNER_TEMP/gh.err"
          : >"$ERR"
          status() {
            local s
            s="$(grep -oE '\(HTTP [0-9]{3}\)' "$ERR" | head -n 1 | tr -dc '0-9')"
            printf '%s' "${s:-unknown}"
          }
          # what each job pushed: its digest; a job that ran and gave none may have pushed one
          pushed=()
          unaccounted=0
          account() {  # JOB RESULT DIGEST
            if [[ "$3" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              pushed+=("$3")
            elif [ "$2" != skipped ]; then
              echo "release: could not account for what $1 pushed: it gave no digest"
              unaccounted=1
            fi
          }
          account build-amd64 "$AMD64_RESULT" "$AMD64"
          account build-arm64 "$ARM64_RESULT" "$ARM64"
          account join "$JOIN_RESULT" "$INDEX"
          if [ "${#pushed[@]}" -eq 0 ]; then
            if [ "$unaccounted" -eq 0 ]; then
              echo "release: removed 0 package versions; 0 of this run's are left"
              exit 0
            fi
            exit 1
          fi
          # every version as `<id> <digest>`; GONE_OK=1: a package that is gone holds none
          versions() {
            local out
            if out="$(gh api --paginate "$PACKAGE_PATH/versions?per_page=100" --jq '.[] | "\(.id) \(.name)"' 2>"$ERR")"; then
              printf '%s\n' "$out"
            elif [ "$1" = 1 ] && grep -q '(HTTP 404)' "$ERR"; then
              return 0
            else
              echo "release: the package's versions could not be read (HTTP $(status))"
              return 1
            fi
          }
          ours() { local d; for d in "${pushed[@]}"; do [ "$1" = "$d" ] && return 0; done; return 1; }
          # this run pushed, so the package is there: a 404 here is a package this token cannot see
          before="$(versions 0)" || { printf '%s\n' "$before"; exit 1; }
          listed=() missing=0 others=0
          for d in "${pushed[@]}"; do
            id="$(awk -v d="$d" '$2 == d { print $1; exit }' <<<"$before")"
            if [[ "$id" =~ ^[0-9]+$ ]]; then
              listed+=("$id $d")
            else
              echo "release: could not find $d among the package's versions"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          while read -r id name; do
            if [ -n "$id" ] && ! ours "$name"; then others=$((others + 1)); fi
          done <<<"$before"
          removed=0 failed=0 whole=0
          if [ "$others" -eq 0 ]; then
            if gh api -X DELETE "$PACKAGE_PATH" >/dev/null 2>"$ERR"; then
              whole=1
              removed="${#listed[@]}"
            else
              echo "release: the package could not be removed whole (HTTP $(status)); removing its versions one by one"
            fi
          fi
          if [ "$whole" -eq 0 ]; then
            for v in "${listed[@]}"; do
              if gh api -X DELETE "$PACKAGE_PATH/versions/${v%% *}" >/dev/null 2>"$ERR"; then
                removed=$((removed + 1))
              else
                echo "release: could not remove ${v#* } (HTTP $(status))"
                failed=1
              fi
            done
          fi
          # read again: a package gone now (removed whole, or with its last version) holds none
          after="$(versions 1)" || { printf '%s\n' "$after"; exit 1; }
          left=0
          while read -r id name; do
            if [ -n "$id" ] && ours "$name"; then left=$((left + 1)); fi
          done <<<"$after"
          if [ "$failed" -eq 0 ] && [ "$left" -eq 0 ] && [ "$unaccounted" -eq 0 ]; then
            echo "release: removed $removed package versions; 0 of this run's are left"
            exit 0
          fi
          if [ "$failed" -eq 0 ] && [ "$left" -gt 0 ]; then
            echo "release: $left of this run's package versions are left"
          fi
          if [ "$unaccounted" -eq 1 ]; then
            echo "release: removed $removed package versions; what this run may also have pushed is named above"
          fi
          exit 1
