name: Bug
description: Something does not work as the documentation says.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not put a real email, a password, a key or a share link in an issue. If an email was
        read wrongly, use the parse-problem form instead. For a security problem, use the private
        report described in SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to see it
      description: The steps, from a new install if you can.
  - type: textarea
    id: doctor
    attributes:
      label: The output of doctor
      description: Run `docker compose run --rm worker tripbox doctor` and paste what it prints. It prints no secret.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version the page shows at the foot of Settings, or the image tag.
    validations:
      required: true
