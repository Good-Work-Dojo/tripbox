# Airlines: IATA code, name, optional short name (trip text) and the words that name the
# airline in an email. config/airlines.yaml adds entries and replaces those with the same code.
- iata: DL
  name: Delta Air Lines
  short: Delta
  match: [delta]
- iata: UA
