# TRIPBOX_BASE_URL=https://trips.example.com
# nginx in front of tripbox at a name of its own: a server block for conf.d/. "web:8110" is
# tripbox's page when nginx is a service in the same compose project; for an nginx on the host,
# write 127.0.0.1:8110 instead.
# For https (the base URL above), add to this block a "listen 443 ssl;" line and the
# "ssl_certificate" and "ssl_certificate_key" lines naming your certificate's files, and send
# plain http on port 80 to https.
# nginx looks "web" up once, when it loads this file: after tripbox's containers are made anew
# (an upgrade, a "docker compose up" that recreates them), reload nginx ("nginx -s reload").
server {
    listen 80;
    server_name trips.example.com;
    # the page takes uploads of up to 10 MB; nginx refuses a body over 1 MB unless told
    client_max_body_size 11m;

    location / {
        # no path after the address: the request's path is handed on as it came
        proxy_pass http://web:8110;
        proxy_set_header Host $host;
    }
}
