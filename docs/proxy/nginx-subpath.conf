# TRIPBOX_BASE_URL=https://example.com/tripbox
# nginx in front of tripbox under a path of a site it already serves: the two location blocks go
# into that site's server block. "web:8110" is tripbox's page when nginx is a service in the same
# compose project; for an nginx on the host, write 127.0.0.1:8110 instead.
# For https (the base URL above), the site's server block holds a "listen 443 ssl;" line and the
# "ssl_certificate" and "ssl_certificate_key" lines naming your certificate's files.
# nginx looks "web" up once, when it loads this file: after tripbox's containers are made anew
# (an upgrade, a "docker compose up" that recreates them), reload nginx ("nginx -s reload").
server {
    listen 80;
    server_name example.com;

    # the bare path: its own exact match, so nginx hands it on instead of answering it with a
    # redirect of its own; tripbox sends it on to /tripbox/
    location = /tripbox {
        proxy_pass http://web:8110;
        proxy_set_header Host $host;
        client_max_body_size 11m;
    }

    # everything under it; ^~ keeps a regex location of the site's (one for every .css or .js
    # file, say) from answering the page's files; no path after the address, so the path is
    # handed on as it came
    location ^~ /tripbox/ {
        proxy_pass http://web:8110;
        proxy_set_header Host $host;
        # the page takes uploads of up to 10 MB; nginx refuses a body over 1 MB unless told
        client_max_body_size 11m;
    }

    # the site's own locations go here, as before
}
